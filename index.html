<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT for All - Opening Game</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Pose and Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- Canvas Confetti for Firework effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .tech-font { font-family: 'Orbitron', sans-serif; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030a16;
            touch-action: none;
        }

        /* Opening Video Screen */
        #opening-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #opening-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .click-hint {
            position: absolute;
            bottom: 30px;
            color: #00ffff;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #00ffff;
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }

        /* Loading Screen Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(3, 10, 22, 0.95);
            z-index: 150;
            transition: opacity 0.5s ease;
        }

        .hidden-screen {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            border: 8px solid #050a1f;
            border-top: 8px solid #00e5ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Video and Canvas Mirroring */
        #webcam, #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Interactive Draggable Word Card */
        .word-card {
            position: absolute;
            padding: 18px 42px;
            background: linear-gradient(135deg, #FFDE00 0%, #E6C200 100%);
            border: 4px solid #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 222, 0, 0.8);
            color: #002B66;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: grab;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            touch-action: none;
        }

        .word-card:active, .word-card.dragging {
            cursor: grabbing;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 255, 255, 0.9);
            border-color: #00E5FF;
            z-index: 35;
        }

        .word-card.placed {
            background: linear-gradient(135deg, #00E676 0%, #00A843 100%);
            color: #FFFFFF;
            border-color: #FFFFFF;
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.6);
            z-index: 20;
            cursor: default;
        }

        /* Target Drop Zone Frame */
        .target-zone {
            position: absolute;
            width: 220px;
            height: 110px;
            border: 4px dashed #00E5FF;
            border-radius: 20px;
            background: rgba(3, 16, 38, 0.75);
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.3), 0 0 15px rgba(0, 229, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: all 0.3s ease;
        }

        .target-zone.matched {
            border-style: solid;
            border-color: #00E676;
            background: rgba(0, 230, 118, 0.25);
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.6);
        }

        /* Minion Celebration Animations */
        .minion-runner {
            position: absolute;
            bottom: -10px;
            width: 130px;
            height: 130px;
            pointer-events: none;
            z-index: 40;
            animation: runAcross 2.2s linear infinite;
        }

        @keyframes runAcross {
            0% { left: -180px; transform: scaleX(1); }
            50% { transform: scaleX(1) translateY(-15px); }
            100% { left: 105vw; transform: scaleX(1); }
        }

        .minion-jumper {
            position: absolute;
            bottom: 20px;
            width: 120px;
            height: 120px;
            pointer-events: none;
            z-index: 40;
            animation: popUp 0.6s ease-out forwards;
        }

        @keyframes popUp {
            0% { transform: translateY(150px) scale(0.5); opacity: 0; }
            70% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .combined-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
            z-index: 50;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Black Fade Screen Effect */
        #black-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* Ending Video Screen */
        #ending-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 180;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #ending-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 1. Opening Video Screen (ดึงจากไฟล์ใน GitHub) -->
    <div id="opening-video-container">
        <video id="opening-video" autoplay loop muted playsinline>
            <source src="opening.mp4" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>
        <div class="click-hint tech-font">คลิกหรือแตะหน้าจอเพื่อเริ่มเปิดงาน</div>
    </div>

    <!-- 2. Loading Screen Overlay -->
    <div id="loading-screen" class="overlay hidden-screen">
        <div class="loader mb-6"></div>
        <h2 class="tech-font text-cyan-400 text-3xl animate-pulse">กำลังเชื่อมต่อระบบ AI...</h2>
    </div>

    <!-- 3. Main Game Layout -->
    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <canvas id="output_canvas"></canvas>

    <div id="game-ui" class="absolute inset-0 pointer-events-none">
        <!-- Target Drop Zones -->
        <div id="target-0" class="target-zone" style="top: 25%; left: 25%;">
            <span class="text-cyan-400/40 font-black text-2xl tracking-widest">1</span>
        </div>
        <div id="target-1" class="target-zone" style="top: 25%; left: 50%;">
            <span class="text-cyan-400/40 font-black text-2xl tracking-widest">2</span>
        </div>
        <div id="target-2" class="target-zone" style="top: 25%; left: 75%;">
            <span class="text-cyan-400/40 font-black text-2xl tracking-widest">3</span>
        </div>

        <!-- Draggable Word Cards -->
        <div id="card-ICT" class="word-card pointer-events-auto" data-word="ICT">ICT</div>
        <div id="card-FOR" class="word-card pointer-events-auto" data-word="FOR">FOR</div>
        <div id="card-ALL" class="word-card pointer-events-auto" data-word="ALL">ALL</div>

        <!-- Bottom Controls -->
        <div class="absolute bottom-6 right-6 flex gap-3 pointer-events-auto z-30">
            <button onclick="resetGame()" class="bg-amber-500/80 hover:bg-amber-400 text-slate-900 font-bold px-5 py-2.5 rounded-full backdrop-blur border border-amber-300/40 shadow-lg transition duration-200 text-sm">
                🔄 รีเซ็ตเกม
            </button>
        </div>
    </div>

    <!-- Minion Celebration Layer -->
    <div id="minion-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-40"></div>

    <!-- 4. Black Screen Transition -->
    <div id="black-screen"></div>

    <!-- 5. Ending Video Screen (ดึงจาก Google Drive) -->
    <div id="ending-video-container">
        <video id="ending-video" playsinline crossorigin="anonymous">
            <source src="https://drive.google.com/uc?export=download&id=1zj2wXhQJo77hH9edDTpXRMwJ9cKH99op" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>
    </div>

    <script>
        // DOM Elements
        const openingVideoContainer = document.getElementById('opening-video-container');
        const openingVideo = document.getElementById('opening-video');
        const loadingScreen = document.getElementById('loading-screen');
        const blackScreen = document.getElementById('black-screen');
        const endingVideoContainer = document.getElementById('ending-video-container');
        const endingVideo = document.getElementById('ending-video');

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        let cameraObj = null;
        let poseObj = null;

        // Audio System
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playGrab() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            },
            playSnap() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            },
            playWin() {
                this.init();
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + i * 0.1 + 0.4);
                });
            }
        };

        // Game State & Variables
        const words = ['ICT', 'FOR', 'ALL'];
        let targets = [
            { id: 0, word: 'ICT', el: document.getElementById('target-0'), occupied: false },
            { id: 1, word: 'FOR', el: document.getElementById('target-1'), occupied: false },
            { id: 2, word: 'ALL', el: document.getElementById('target-2'), occupied: false }
        ];

        let cards = [];
        let activeCard = null;
        let isGameFinished = false;

        // Sequence Event Handlers
        openingVideoContainer.addEventListener('click', startSequence);
        openingVideoContainer.addEventListener('touchstart', startSequence);

        function startSequence() {
            AudioFX.init();

            openingVideo.pause();
            openingVideoContainer.style.display = 'none';

            loadingScreen.classList.remove('hidden-screen');

            initAIAndCamera();

            openingVideoContainer.removeEventListener('click', startSequence);
            openingVideoContainer.removeEventListener('touchstart', startSequence);
        }

        function getMinionSVG() {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect x="25" y="25" width="50" height="60" rx="25" fill="#FFDE00"/>
                <rect x="25" y="65" width="50" height="20" rx="5" fill="#0055B8"/>
                <rect x="35" y="75" width="10" height="15" fill="#003377"/>
                <rect x="55" y="75" width="10" height="15" fill="#003377"/>
                <line x1="25" y1="65" x2="35" y2="75" stroke="#003377" stroke-width="4"/>
                <line x1="75" y1="65" x2="65" y2="75" stroke="#003377" stroke-width="4"/>
                <rect x="25" y="38" width="50" height="8" fill="#333"/>
                <circle cx="50" cy="42" r="14" fill="#CCCCCC" stroke="#888888" stroke-width="2"/>
                <circle cx="50" cy="42" r="9" fill="#FFFFFF"/>
                <circle cx="50" cy="42" r="4" fill="#4B2E1E"/>
                <circle cx="52" cy="40" r="1.5" fill="#FFFFFF"/>
                <path d="M 40 56 Q 50 64 60 56" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        function initCards() {
            cards = [];
            const shuffledWords = [...words].sort(() => Math.random() - 0.5);
            const bottomY = window.innerHeight * 0.80;
            const positions = [
                { x: window.innerWidth * 0.22, y: bottomY },
                { x: window.innerWidth * 0.50, y: bottomY },
                { x: window.innerWidth * 0.78, y: bottomY }
            ];

            shuffledWords.forEach((word, index) => {
                const el = document.getElementById(`card-${word}`);
                const pos = positions[index];
                
                const cardObj = {
                    word: word,
                    el: el,
                    x: pos.x,
                    y: pos.y,
                    isPlaced: false,
                    targetIdx: null,
                    width: el.offsetWidth || 180,
                    height: el.offsetHeight || 90
                };

                cards.push(cardObj);
                el.classList.remove('placed', 'dragging');
                updateCardPosition(cardObj, pos.x, pos.y);
                setupMouseTouchDrag(cardObj);
            });
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function updateCardPosition(card, posX, posY) {
            const w = card.width || 180;
            const h = card.height || 90;

            const clampedX = clamp(posX - w / 2, 10, window.innerWidth - w - 10);
            const clampedY = clamp(posY - h / 2, 10, window.innerHeight - h - 10);

            card.x = clampedX + w / 2;
            card.y = clampedY + h / 2;
            card.el.style.left = `${clampedX}px`;
            card.el.style.top = `${clampedY}px`;
        }

        function setupMouseTouchDrag(card) {
            let isDragging = false;

            const onPointerDown = (e) => {
                if (card.isPlaced || isGameFinished) return;
                isDragging = true;
                activeCard = card;
                card.el.classList.add('dragging');
                card.el.setPointerCapture(e.pointerId);
                AudioFX.playGrab();
                e.stopPropagation();
            };

            const onPointerMove = (e) => {
                if (!isDragging || card.isPlaced) return;
                updateCardPosition(card, e.clientX, e.clientY);
            };

            const onPointerUp = (e) => {
                if (!isDragging) return;
                isDragging = false;
                card.el.classList.remove('dragging');
                checkCardDrop(card);
                if (activeCard === card) activeCard = null;
            };

            card.el.onpointerdown = onPointerDown;
            card.el.onpointermove = onPointerMove;
            card.el.onpointerup = onPointerUp;
            card.el.onpointercancel = onPointerUp;
        }

        function checkCardDrop(card) {
            if (card.isPlaced) return;

            targets.forEach((target) => {
                const targetBox = target.el.getBoundingClientRect();
                const targetCenterX = targetBox.left + targetBox.width / 2;
                const targetCenterY = targetBox.top + targetBox.height / 2;
                const distToTarget = Math.hypot(card.x - targetCenterX, card.y - targetCenterY);

                if (distToTarget < 120 && !target.occupied && card.word === target.word) {
                    snapCardToTarget(card, target, targetCenterX, targetCenterY);
                }
            });
        }

        function snapCardToTarget(card, target, targetX, targetY) {
            card.isPlaced = true;
            card.targetIdx = target.id;
            target.occupied = true;

            card.el.classList.remove('dragging');
            card.el.classList.add('placed');
            
            updateCardPosition(card, targetX, targetY);
            target.el.classList.add('matched');
            
            AudioFX.playSnap();
            if (activeCard === card) activeCard = null;

            checkWinCondition();
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            
            cards.forEach(card => {
                if (card.el) {
                    card.width = card.el.offsetWidth;
                    card.height = card.el.offsetHeight;
                    if (!card.isPlaced) {
                        updateCardPosition(card, card.x, card.y);
                    }
                }
            });
        }
        window.addEventListener('resize', resizeCanvas);

        function onPoseResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks && !isGameFinished) {
                const landmarks = results.poseLandmarks;

                const leftHand = {
                    x: (1 - landmarks[19].x) * window.innerWidth,
                    y: landmarks[19].y * window.innerHeight
                };
                const rightHand = {
                    x: (1 - landmarks[20].x) * window.innerWidth,
                    y: landmarks[20].y * window.innerHeight
                };

                drawHandCursor(leftHand.x, leftHand.y);
                drawHandCursor(rightHand.x, rightHand.y);

                processHandInteraction(leftHand);
                processHandInteraction(rightHand);
            }

            canvasCtx.restore();
        }

        function drawHandCursor(x, y) {
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 22, 0, 2 * Math.PI);
            canvasCtx.fillStyle = 'rgba(0, 229, 255, 0.4)';
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#FFFFFF';
            canvasCtx.stroke();

            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 7, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#FFDE00';
            canvasCtx.fill();
        }

        function processHandInteraction(handPos) {
            const touchRadius = 80;

            if (!activeCard) {
                for (let card of cards) {
                    if (card.isPlaced) continue;

                    const dist = Math.hypot(handPos.x - card.x, handPos.y - card.y);
                    if (dist < touchRadius + 30) {
                        activeCard = card;
                        card.el.classList.add('dragging');
                        AudioFX.playGrab();
                        break;
                    }
                }
            } else {
                if (activeCard.isPlaced) {
                    activeCard = null;
                    return;
                }

                updateCardPosition(activeCard, handPos.x, handPos.y);
                checkCardDrop(activeCard);

                if (activeCard) {
                    const dragDist = Math.hypot(handPos.x - activeCard.x, handPos.y - activeCard.y);
                    if (dragDist > 180) {
                        activeCard.el.classList.remove('dragging');
                        activeCard = null;
                    }
                }
            }
        }

        function checkWinCondition() {
            const allMatched = cards.every(c => c.isPlaced);
            if (allMatched && !isGameFinished) {
                isGameFinished = true;
                setTimeout(startVictorySequence, 350);
            }
        }

        function startVictorySequence() {
            AudioFX.playWin();

            targets.forEach(t => t.el.style.opacity = '0');

            const combinedContainer = document.createElement('div');
            combinedContainer.className = 'combined-container';
            document.body.appendChild(combinedContainer);

            const sortedCards = [
                cards.find(c => c.word === 'ICT'),
                cards.find(c => c.word === 'FOR'),
                cards.find(c => c.word === 'ALL')
            ];

            sortedCards.forEach(c => {
                if (c && c.el) {
                    combinedContainer.appendChild(c.el);
                    c.el.style.position = 'relative';
                    c.el.style.top = '0';
                    c.el.style.left = '0';
                }
            });

            launchFireworks();
            spawnMinions();

            setTimeout(() => {
                blackScreen.style.opacity = '1';

                setTimeout(() => {
                    if (cameraObj) {
                        cameraObj.stop();
                    }

                    endingVideoContainer.style.display = 'flex';
                    endingVideo.play().catch(err => {
                        console.log("Autoplay blocked, muted play.");
                        endingVideo.muted = true;
                        endingVideo.play();
                    });

                }, 1500);
            }, 2500);
        }

        function launchFireworks() {
            const count = 200;
            const defaults = { origin: { y: 0.6 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#FFDE00', '#00E5FF'] });
            fire(0.2, { spread: 60, colors: ['#FFFFFF', '#00E676'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 1.2 });
            fire(0.2, { spread: 120, startVelocity: 45, decay: 0.92, scalar: 1.4 });
        }

        function spawnMinions() {
            const layer = document.getElementById('minion-layer');
            const minionImg = getMinionSVG();

            for (let i = 0; i < 4; i++) {
                const img = document.createElement('img');
                img.src = minionImg;
                img.className = 'minion-runner';
                img.style.animationDelay = `${i * 0.35}s`;
                img.style.bottom = `${10 + Math.random() * 40}px`;
                layer.appendChild(img);
            }

            const bottomPositions = [10, 25, 40, 60, 75, 90];
            bottomPositions.forEach((posPct, idx) => {
                const img = document.createElement('img');
                img.src = minionImg;
                img.className = 'minion-jumper';
                img.style.left = `${posPct}%`;
                img.style.animationDelay = `${idx * 0.1}s`;
                layer.appendChild(img);
            });
        }

        async function initAIAndCamera() {
            try {
                poseObj = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });

                poseObj.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    enableSegmentation: false,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                poseObj.onResults(onPoseResults);

                videoElement.style.display = 'block';

                cameraObj = new Camera(videoElement, {
                    onFrame: async () => {
                        await poseObj.send({ image: videoElement });
                        if (!loadingScreen.classList.contains('hidden-screen')) {
                            loadingScreen.classList.add('hidden-screen');
                        }
                    },
                    width: 1280,
                    height: 720
                });

                await cameraObj.start();
            } catch (err) {
                console.error("Camera access/AI initialization error:", err);
                loadingScreen.innerHTML = `
                    <h2 class="text-red-500 text-2xl font-bold">ไม่สามารถเชื่อมต่อกล้องได้</h2>
                    <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-amber-500 text-slate-900 font-bold rounded-full">ลองใหม่อีกครั้ง</button>
                `;
            }
        }

        function resetGame() {
            location.reload();
        }

        window.onload = () => {
            resizeCanvas();
            initCards();
        };
    </script>
</body>
</html>
