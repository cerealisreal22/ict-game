<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT for All - Minion Opening Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Libraries for AI Body Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050a1f;
            font-family: 'Mitr', sans-serif;
            touch-action: none;
        }

        .tech-font { font-family: 'Orbitron', sans-serif; }

        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 10, 31, 0.9);
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .hidden-screen {
            opacity: 0;
            pointer-events: none;
        }

        #minions-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .minion-sprite {
            position: absolute;
            bottom: -150px;
            width: 80px;
            height: 120px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 150'><rect x='25' y='20' width='50' height='90' rx='25' fill='%23FFD700'/><path d='M 25 70 L 75 70 L 75 110 A 25 25 0 0 1 25 110 Z' fill='%232B547E'/><rect x='20' y='40' width='60' height='10' fill='%23333'/><circle cx='50' cy='45' r='15' fill='%23DDD' stroke='%23555' stroke-width='4'/><circle cx='50' cy='45' r='5' fill='%23000'/><path d='M 40 60 Q 50 65 60 60' stroke='%23000' stroke-width='2' fill='none'/><rect x='35' y='110' width='10' height='15' fill='%23333'/><rect x='55' y='110' width='10' height='15' fill='%23333'/><path d='M 20 60 Q 10 50 15 40' stroke='%23FFD700' stroke-width='6' stroke-linecap='round' fill='none'/><path d='M 80 60 Q 90 50 85 40' stroke='%23FFD700' stroke-width='6' stroke-linecap='round' fill='none'/></svg>");
            background-size: contain;
            background-repeat: no-repeat;
        }

        @keyframes runRight {
            0% { transform: translateX(-100px) translateY(0) rotate(-10deg); }
            25% { transform: translateX(25vw) translateY(-30px) rotate(10deg); }
            50% { transform: translateX(50vw) translateY(0) rotate(-10deg); }
            75% { transform: translateX(75vw) translateY(-30px) rotate(10deg); }
            100% { transform: translateX(110vw) translateY(0) rotate(-10deg); }
        }
        
        @keyframes runLeft {
            0% { transform: translateX(110vw) translateY(0) rotate(10deg) scaleX(-1); }
            25% { transform: translateX(75vw) translateY(-30px) rotate(-10deg) scaleX(-1); }
            50% { transform: translateX(50vw) translateY(0) rotate(10deg) scaleX(-1); }
            75% { transform: translateX(25vw) translateY(-30px) rotate(-10deg) scaleX(-1); }
            100% { transform: translateX(-100px) translateY(0) rotate(10deg) scaleX(-1); }
        }

        @keyframes jumpUp {
            0% { transform: translateY(150px) scale(0.5); opacity: 0; }
            50% { transform: translateY(-50vh) scale(1.5); opacity: 1; }
            100% { transform: translateY(150px) scale(1); opacity: 0; }
        }

        .run-r { animation: runRight 4s linear infinite; }
        .run-l { animation: runLeft 4s linear infinite; }
        .jump { animation: jumpUp 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        .loader {
            border: 8px solid #050a1f;
            border-top: 8px solid #0ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Video End Screen Overlay */
        #ending-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #ending-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* หรือเปลี่ยนเป็น contain ถ้าไม่อยากให้ภาพโดนตัดขอบ */
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="bg-grid"></div>
        
        <!-- Camera feed hidden, drawn to canvas -->
        <video id="input_video" style="display: none;" playsinline></video>
        <canvas id="output_canvas"></canvas>

        <div id="minions-container"></div>

        <!-- Loading Screen Overlay -->
        <div id="loading-screen" class="overlay">
            <div class="loader mb-6"></div>
            <h2 class="tech-font text-cyan-400 text-3xl animate-pulse">กำลังเชื่อมต่อระบบ AI...</h2>
        </div>

        <!-- Fade to Black Screen -->
        <div id="black-screen" class="fixed top-0 left-0 w-full h-full bg-black z-[100] pointer-events-none opacity-0" style="transition: opacity 1.5s ease-in-out;"></div>

        <!-- Ending Video Screen (เพิ่มตรงนี้) -->
        <div id="ending-video-container">
            <video id="ending-video" playsinline>
                <!-- ใส่ชื่อไฟล์วิดีโอของคุณตรงนี้ เช่น ending.mp4 หรือใส่ URL วิดีโอสด -->
                <source src="ending.mp4" type="video/mp4">
                เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
            </video>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingScreen = document.getElementById('loading-screen');
        const minionsContainer = document.getElementById('minions-container');

        // Ending Video Elements
        const endingVideoContainer = document.getElementById('ending-video-container');
        const endingVideo = document.getElementById('ending-video');

        let isGameRunning = false;
        let isGameWon = false;
        let hideTargets = false;
        let poseAI = null;
        let camera = null;
        let cw = window.innerWidth;
        let ch = window.innerHeight;
        let fireworksInterval = null;

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.addEventListener('click', getAudioCtx);
        window.addEventListener('touchstart', getAudioCtx);
        window.addEventListener('mousemove', getAudioCtx);

        function playGrabSound() {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        let lastDragSoundTime = 0;
        function playDragSound(x, y, lastX, lastY) {
            const now = Date.now();
            if (now - lastDragSoundTime < 60) return;
            
            try {
                const speed = Math.hypot(x - lastX, y - lastY);
                if (speed > 2) {
                    lastDragSoundTime = now;
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    const freq = 250 + Math.min(speed * 20, 650);
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch(e) {}
        }

        function playSnapSound() {
            try {
                const ctx = getAudioCtx();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.04);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.04 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.04);
                    osc.stop(ctx.currentTime + idx * 0.04 + 0.35);
                });
            } catch(e) {}
        }

        function playFireworkSound() {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150 + Math.random() * 200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        window.addEventListener('resize', () => {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvasElement.width = cw;
            canvasElement.height = ch;
            initLevelLayout();
        });

        let pieces = [];
        let targets = [];
        const pieceWidth = 180;
        const pieceHeight = 90;
        
        let hands = {
            left: { x: 0, y: 0, active: false, holds: null },
            right: { x: 0, y: 0, active: false, holds: null }
        };

        let particles = [];

        function initLevelLayout() {
            const spacing = cw < 800 ? 100 : 250;
            const startX = cw/2 - spacing;
            const targetY = ch * 0.25;

            targets = [
                { id: 'ICT', text: 'ICT', x: startX, y: targetY },
                { id: 'for', text: 'FOR', x: startX + spacing, y: targetY },
                { id: 'all', text: 'ALL', x: startX + spacing * 2, y: targetY }
            ];

            if (!isGameWon) {
                let xPositions = [cw*0.2, cw*0.5, cw*0.8];
                xPositions.sort(() => Math.random() - 0.5);

                pieces = [
                    { id: 'ICT', text: 'ICT', x: xPositions[0], y: ch*0.75 + (Math.random() * 40 - 20), placed: false, heldBy: null, color: '#0ff' },
                    { id: 'for', text: 'FOR', x: xPositions[1], y: ch*0.8 + (Math.random() * 40 - 20), placed: false, heldBy: null, color: '#f0f' },
                    { id: 'all', text: 'ALL', x: xPositions[2], y: ch*0.75 + (Math.random() * 40 - 20), placed: false, heldBy: null, color: '#ff0' }
                ];
            } else {
                const centerX = cw / 2;
                const centerY = ch / 2;
                const finalSpacing = pieceWidth + 10;
                
                pieces.forEach(p => {
                    if (p.id === 'ICT') p.targetX = centerX - finalSpacing;
                    else if (p.id === 'for') p.targetX = centerX;
                    else if (p.id === 'all') p.targetX = centerX + finalSpacing;
                    p.targetY = centerY;
                });
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * (Math.random() * 20 + 10);
                this.vy = (Math.random() - 0.5) * (Math.random() * 20 + 10);
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.vy += 0.2;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            playFireworkSound();
            const colors = ['#0ff', '#ff0', '#f0f', '#fff', '#FFD700'];
            for(let i=0; i<80; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function spawnMinionCelebration() {
            for(let i=0; i<8; i++) {
                setTimeout(() => {
                    const minion = document.createElement('div');
                    minion.className = `minion-sprite ${Math.random() > 0.5 ? 'run-r' : 'run-l'}`;
                    minion.style.bottom = `${Math.random() * 80}px`;
                    minion.style.filter = `hue-rotate(${Math.random() * 20 - 10}deg)`;
                    minion.style.animationDuration = `2.5s`;
                    minionsContainer.appendChild(minion);
                }, i * 150);
            }

            for(let i=0; i<4; i++) {
                setTimeout(() => {
                    const minion = document.createElement('div');
                    minion.className = 'minion-sprite jump';
                    minion.style.left = `${15 + Math.random() * 70}vw`;
                    minion.style.bottom = '0';
                    minionsContainer.appendChild(minion);
                    
                    setTimeout(() => minion.remove(), 1800);
                }, 400 + i * 250);
            }
        }

        function onResults(results) {
            if (!isGameRunning) return;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();

            hands.left.active = false;
            hands.right.active = false;

            if (results.poseLandmarks) {
                const leftWrist = results.poseLandmarks[16];
                const rightWrist = results.poseLandmarks[15];

                drawAIOverlay(results.poseLandmarks);

                if (leftWrist && leftWrist.visibility > 0.5) {
                    hands.left.x = (1 - leftWrist.x) * cw;
                    hands.left.y = leftWrist.y * ch;
                    hands.left.active = true;
                }

                if (rightWrist && rightWrist.visibility > 0.5) {
                    hands.right.x = (1 - rightWrist.x) * cw;
                    hands.right.y = rightWrist.y * ch;
                    hands.right.active = true;
                }
            }

            updateGameLogic();
            drawGameUI();
        }

        function drawAIOverlay(landmarks) {
            canvasCtx.save();
            canvasCtx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            canvasCtx.lineWidth = 2;
            
            const connections = [
                [11, 13], [13, 15],
                [12, 14], [14, 16],
                [11, 12],
                [23, 24],
                [11, 23], [12, 24]
            ];

            connections.forEach(conn => {
                const p1 = landmarks[conn[0]];
                const p2 = landmarks[conn[1]];
                if (p1.visibility > 0.5 && p2.visibility > 0.5) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo((1 - p1.x) * cw, p1.y * ch);
                    canvasCtx.lineTo((1 - p2.x) * cw, p2.y * ch);
                    canvasCtx.stroke();
                }
            });

            [11,12,13,14,15,16,23,24].forEach(idx => {
                const p = landmarks[idx];
                if (p.visibility > 0.5) {
                    canvasCtx.beginPath();
                    canvasCtx.arc((1 - p.x) * cw, p.y * ch, 4, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = '#0ff';
                    canvasCtx.fill();
                    canvasCtx.shadowBlur = 10;
                    canvasCtx.shadowColor = '#0ff';
                }
            });
            canvasCtx.restore();
        }

        function updateGameLogic() {
            if (isGameWon) {
                pieces.forEach(p => {
                    if (p.targetX !== undefined && p.targetY !== undefined) {
                        p.x += (p.targetX - p.x) * 0.08;
                        p.y += (p.targetY - p.y) * 0.08;
                    }
                });
                return;
            }

            const grabRadius = 80;
            const snapRadius = 100;

            ['left', 'right'].forEach(side => {
                let hand = hands[side];
                if (!hand.active) {
                    if (hand.holds) {
                        hand.holds.heldBy = null;
                        hand.holds = null;
                    }
                    return;
                }

                if (!hand.holds) {
                    for (let p of pieces) {
                        if (!p.placed && !p.heldBy) {
                            let dist = Math.hypot(hand.x - p.x, hand.y - p.y);
                            if (dist < grabRadius) {
                                p.heldBy = side;
                                hand.holds = p;
                                hand.lastX = hand.x;
                                hand.lastY = hand.y;
                                playGrabSound();
                                break;
                            }
                        }
                    }
                }

                if (hand.holds) {
                    let p = hand.holds;
                    
                    if (hand.lastX !== undefined && hand.lastY !== undefined) {
                        playDragSound(hand.x, hand.y, hand.lastX, hand.lastY);
                    }
                    hand.lastX = hand.x;
                    hand.lastY = hand.y;

                    p.x += (hand.x - p.x) * 0.3;
                    p.y += (hand.y - p.y) * 0.3;

                    let target = targets.find(t => t.id === p.id);
                    if (target) {
                        let distToTarget = Math.hypot(p.x - target.x, p.y - target.y);
                        if (distToTarget < snapRadius) {
                            p.placed = true;
                            p.x = target.x;
                            p.y = target.y;
                            p.heldBy = null;
                            hand.holds = null;
                            
                            playSnapSound();
                            createExplosion(target.x, target.y);
                            
                            checkWinCondition();
                        }
                    }
                }
            });
        }

        function checkWinCondition() {
            if (pieces.every(p => p.placed) && !isGameWon) {
                isGameWon = true;
                hideTargets = true;
                
                const centerX = cw / 2;
                const centerY = ch / 2;
                const finalSpacing = pieceWidth + 10;

                pieces.find(p => p.id === 'ICT').targetX = centerX - finalSpacing;
                pieces.find(p => p.id === 'for').targetX = centerX;
                pieces.find(p => p.id === 'all').targetX = centerX + finalSpacing;
                pieces.forEach(p => p.targetY = centerY);

                setTimeout(() => {
                    fireworksInterval = setInterval(() => {
                        createExplosion(cw * Math.random(), ch * (Math.random() * 0.5));
                    }, 400);

                    spawnMinionCelebration();

                    // 1. เริ่มเอฟเฟกต์จอดำ
                    setTimeout(() => {
                        const blackScreen = document.getElementById('black-screen');
                        blackScreen.style.opacity = '1';
                        
                        // 2. เมื่อหน้าจอดำสนิท (1.5 - 2 วินาที) สั่งเปิดและเล่นวิดีโอทันที
                        setTimeout(() => {
                            if (fireworksInterval) clearInterval(fireworksInterval);
                            
                            // ปิดการทำงานของกล้องเพื่อประหยัดทรัพยากร
                            if (camera) camera.stop();

                            // แสดงหน้าต่างวิดีโอและเริ่มเล่น
                            endingVideoContainer.style.display = 'flex';
                            
                            // พยายามเล่นวิดีโอแบบมีเสียง ถ้าเบราว์เซอร์บล็อกจะเล่นแบบปิดเสียงอัตโนมัติ
                            endingVideo.play().catch(error => {
                                console.log("Autoplay with audio blocked, playing muted.");
                                endingVideo.muted = true;
                                endingVideo.play();
                            });

                        }, 1800);
                    }, 2000);
                }, 800);
            }
        }

        function drawGameUI() {
            canvasCtx.save();
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'middle';

            if (!hideTargets) {
                targets.forEach(t => {
                    canvasCtx.save();
                    
                    canvasCtx.fillStyle = 'rgba(5, 25, 55, 0.85)';
                    canvasCtx.strokeStyle = '#00ffff';
                    canvasCtx.lineWidth = 4;
                    canvasCtx.shadowBlur = 20;
                    canvasCtx.shadowColor = '#00ffff';

                    canvasCtx.beginPath();
                    canvasCtx.roundRect(t.x - pieceWidth/2, t.y - pieceHeight/2, pieceWidth, pieceHeight, 15);
                    canvasCtx.fill();
                    canvasCtx.stroke();

                    canvasCtx.shadowBlur = 0;
                    canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    canvasCtx.lineWidth = 2;
                    canvasCtx.setLineDash([8, 8]);
                    canvasCtx.beginPath();
                    canvasCtx.roundRect(t.x - pieceWidth/2 + 6, t.y - pieceHeight/2 + 6, pieceWidth - 12, pieceHeight - 12, 10);
                    canvasCtx.stroke();
                    canvasCtx.setLineDash([]);

                    canvasCtx.restore();
                });
            }

            pieces.forEach(p => {
                canvasCtx.save();
                canvasCtx.translate(p.x, p.y);
                
                if (!p.placed && !p.heldBy) {
                    canvasCtx.translate(0, Math.sin(Date.now() / 300) * 10);
                }

                let scale = 1;
                if (p.placed) scale = 1.05;
                if (p.heldBy) scale = 1.1;
                canvasCtx.scale(scale, scale);

                canvasCtx.shadowBlur = p.placed ? 30 : (p.heldBy ? 20 : 10);
                canvasCtx.shadowColor = p.placed ? '#ff0' : p.color;

                canvasCtx.fillStyle = p.placed ? 'rgba(255, 215, 0, 0.9)' : 'rgba(10, 20, 50, 0.9)';
                canvasCtx.strokeStyle = p.placed ? '#fff' : p.color;
                canvasCtx.lineWidth = 4;
                
                canvasCtx.beginPath();
                canvasCtx.roundRect(-pieceWidth/2, -pieceHeight/2, pieceWidth, pieceHeight, 15);
                canvasCtx.fill();
                canvasCtx.stroke();

                canvasCtx.font = "bold 40px 'Orbitron'";
                canvasCtx.fillStyle = p.placed ? '#000' : '#fff';
                canvasCtx.shadowBlur = 0;
                canvasCtx.fillText(p.text, 0, 0);
                
                canvasCtx.restore();
            });

            if (!isGameWon) {
                ['left', 'right'].forEach(side => {
                    let hand = hands[side];
                    if (hand.active) {
                        canvasCtx.beginPath();
                        canvasCtx.fillStyle = hand.holds ? 'rgba(255, 215, 0, 0.6)' : 'rgba(0, 255, 255, 0.6)';
                        canvasCtx.fill();
                        canvasCtx.strokeStyle = '#fff';
                        canvasCtx.lineWidth = 3;
                        canvasCtx.stroke();
                    
                        canvasCtx.beginPath();
                        canvasCtx.strokeStyle = hand.holds ? 'rgba(255, 215, 0, 0.3)' : 'rgba(0, 255, 255, 0.3)';
                        canvasCtx.stroke();
                    }
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(canvasCtx);
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            canvasCtx.restore();
        }

        async function initializeAI() {
            try {
                poseAI = new Pose({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }});

                poseAI.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    enableSegmentation: false,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });

                poseAI.onResults(onResults);

                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await poseAI.send({image: videoElement});
                        
                        if (!isGameRunning) {
                            isGameRunning = true;
                            loadingScreen.classList.add('hidden-screen');
                        }
                    },
                    width: 1280,
                    height: 720,
                    facingMode: 'user'
                });

                await camera.start();
                
            } catch (error) {
                console.error("Camera access or AI init failed:", error);
                loadingScreen.innerHTML = `
                    <h2 class="text-red-500 text-2xl font-bold">ไม่สามารถเปิดกล้องได้</h2>
                    <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-blue-500 text-white rounded">ลองใหม่</button>
                `;
            }
        }

        window.addEventListener('load', () => {
            canvasElement.width = cw;
            canvasElement.height = ch;
            initLevelLayout();
            initializeAI();
        });

        initLevelLayout();
    </script>
</body>
</html>
